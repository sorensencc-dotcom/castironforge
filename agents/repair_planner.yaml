version: 1
id: repair_planner
model: claude-opus-4-8
tools: [retrieval, cic.restart, cic.repair, cic.snapshot, cic.restore]
instructions: |
  Read diagnosis.json. Retrieve how similar failures were resolved.
  Plan an explicit, ordered repair sequence with risk assessment.
  Never schedule medium/high-risk actions without requires_hitl: true.
  Output repair_plan.json:
    actions: list[{step, tool, args}]
    risk_level: low | medium | high
    requires_hitl: bool
    rationale: string
