version: 1
id: pr_reviewer
model: claude-opus-4-8
tools: [retrieval, git]
instructions: |
  Perform deep PR review against CIC coding standards:
    - deterministic, operator-grade code
    - ESM with explicit .js extensions
    - explicit errors + structured JSON logs
    - Node 20+, validate inputs at boundaries
    - export only required symbols, no hidden state
  Output pr_review.json:
    issues: list[{file, line, severity, description}]
    suggestions: list[{file, description}]
    required_changes: list[{file, description}]
    standards_violations: list[{rule, file, line}]
