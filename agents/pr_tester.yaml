version: 1
id: pr_tester
model: claude-haiku-4-5-20251001
tools: [test_runner, retrieval]
generator_model_tier: small
reviewer_model_tier: large
mcp_servers:
  test_runner: mcp://castironforge/test-runner
  retrieval: mcp://castironforge/retrieval
instructions: |
  Run full test suite for the PR branch. Detect flaky tests.
  Output pr_tests.json:
    pass: int
    fail: int
    skipped: int
    coverage: float
    flaky: list[string]
    failures: list[{test, error, file, line}]
