<!DOCTYPE html>
<html>
<head>
    <title>CIC Conflict Graph 001-030</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background: #1a1a1a; color: #eee; margin: 0; overflow: hidden; }
        .links line { stroke-opacity: 0.6; stroke-width: 2px; }
        .nodes circle { stroke: #fff; stroke-width: 1.5px; }
        text { font-size: 12px; pointer-events: none; fill: #fff; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>CIC Conflict Graph</h3>
        <p>GAPs 001-030 (1881-1960)</p>
    </div>
    <svg width="100vw" height="100vh"></svg>
    <script>
        const data = {
            "nodes": [
                {"id":"henry_ford","label":"Henry Ford","group":"authority","color":"#ff4d4d"},
                {"id":"edsel_ford","label":"Edsel Ford","group":"authority","color":"#ff4d4d"},
                {"id":"hfii","label":"Henry Ford II","group":"authority","color":"#ff4d4d"},
                {"id":"mcnamara","label":"Robert McNamara","group":"authority","color":"#ff4d4d"},
                {"id":"sorensen","label":"Charles Sorensen","group":"industrial","color":"#4da6ff"},
                {"id":"bennett","label":"Harry Bennett","group":"industrial","color":"#4da6ff"},
                {"id":"prod_eng","label":"Production Engineering","group":"industrial","color":"#4da6ff"},
                {"id":"soc_dept","label":"Sociological Department","group":"cultural","color":"#cc66ff"},
                {"id":"whiz_kids","label":"Whiz Kids","group":"cultural","color":"#cc66ff"},
                {"id":"legacy_execs","label":"Legacy Executives","group":"cultural","color":"#cc66ff"},
                {"id":"gm","label":"GM","group":"strategic","color":"#66cc66"},
                {"id":"edsel_div","label":"Edsel Division","group":"strategic","color":"#66cc66"},
                {"id":"ford_div","label":"Ford Division","group":"strategic","color":"#66cc66"},
                {"id":"falcon","label":"Falcon Program","group":"strategic","color":"#66cc66"},
                {"id":"uaw","label":"UAW","group":"labor","color":"#ffcc00"}
            ],
            "links": [
                {"source":"henry_ford","target":"edsel_ford","type":"authority","color":"#ff1a1a"},
                {"source":"henry_ford","target":"sorensen","type":"authority","color":"#ff1a1a"},
                {"source":"sorensen","target":"bennett","type":"industrial","color":"#1a75ff"},
                {"source":"hfii","target":"legacy_execs","type":"authority","color":"#ff1a1a"},
                {"source":"hfii","target":"bennett","type":"authority","color":"#ff1a1a"},
                {"source":"whiz_kids","target":"legacy_execs","type":"cultural","color":"#b366ff"},
                {"source":"mcnamara","target":"hfii","type":"authority","color":"#ff1a1a"},
                {"source":"prod_eng","target":"soc_dept","type":"cultural","color":"#b366ff"},
                {"source":"ford_div","target":"edsel_div","type":"strategic","color":"#33cc33"},
                {"source":"gm","target":"ford_div","type":"strategic","color":"#33cc33"},
                {"source":"uaw","target":"ford_div","type":"labor","color":"#e6b800"},
                {"source":"falcon","target":"edsel_div","type":"strategic","color":"#33cc33"}
            ]
        };

        const svg = d3.select("svg");
        const width = window.innerWidth;
        const height = window.innerHeight;

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d. => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(data.links)
            .enter().append("line")
            .attr("stroke", d => d.color);

        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(data.nodes)
            .enter().append("g")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        node.append("circle")
            .attr("r", 12)
            .attr("fill", d => d.color);

        node.append("text")
            .attr("dx", 15)
            .attr("dy", ".35em")
            .text(d => d.label);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
    </script>
</body>
</html>
