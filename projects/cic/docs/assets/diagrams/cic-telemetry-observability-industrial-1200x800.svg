<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="800"
  viewBox="0 0 1200 800"
>
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#1A1410" />

  <!-- Grid -->
  <g stroke="#2C2420" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
    <line x1="1100" y1="0" x2="1100" y2="800" />

    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="0" y1="680" x2="1200" y2="680" />
  </g>

  <!-- Title -->
  <text
    x="60"
    y="70"
    fill="#E8E0D4"
    font-family="Playfair Display, serif"
    font-size="32"
  >
    Telemetry & Observability
  </text>

  <!-- Sources Row -->
  <!-- Harvester -->
  <g>
    <rect
      x="60"
      y="180"
      width="220"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.2"
    />
    <text
      x="170"
      y="220"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="18"
    >
      HARVESTER
    </text>
    <text
      x="170"
      y="250"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Extractors · Enrichment
    </text>
  </g>

  <!-- Orchestrator -->
  <g>
    <rect
      x="320"
      y="180"
      width="220"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.2"
    />
    <text
      x="430"
      y="220"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="18"
    >
      ORCHESTRATOR
    </text>
    <text
      x="430"
      y="250"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Decisions · Routing logs
    </text>
  </g>

  <!-- Queue/DLQ -->
  <g>
    <rect
      x="580"
      y="180"
      width="220"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.2"
    />
    <text
      x="690"
      y="220"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="18"
    >
      QUEUE / DLQ
    </text>
    <text
      x="690"
      y="250"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Depth · Retries · Poison msgs
    </text>
  </g>

  <!-- Control Plane -->
  <g>
    <rect
      x="840"
      y="180"
      width="220"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.2"
    />
    <text
      x="950"
      y="220"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="18"
    >
      CONTROL PLANE
    </text>
    <text
      x="950"
      y="250"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Region health · Circuit state
    </text>
  </g>

  <!-- Telemetry Ingest -->
  <g>
    <rect
      x="300"
      y="360"
      width="600"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.5"
    />
    <text
      x="600"
      y="400"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="20"
    >
      TELEMETRY INGEST
    </text>
    <text
      x="600"
      y="430"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Structured logs · Metrics · Events
    </text>
  </g>

  <!-- Storage Layer -->
  <g>
    <rect
      x="300"
      y="520"
      width="600"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.5"
    />
    <text
      x="600"
      y="560"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="20"
    >
      TELEMETRY STORAGE
    </text>
    <text
      x="600"
      y="590"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Time-series DB · Search index
    </text>
  </g>

  <!-- Dashboard -->
  <g>
    <rect
      x="840"
      y="520"
      width="260"
      height="120"
      fill="#2C2420"
      stroke="#B8922A"
      stroke-width="2.5"
    />
    <text
      x="970"
      y="560"
      text-anchor="middle"
      fill="#E8E0D4"
      font-family="Barlow Condensed"
      font-size="20"
    >
      CIC DASHBOARD
    </text>
    <text
      x="970"
      y="590"
      text-anchor="middle"
      fill="#9A9088"
      font-family="Libre Baskerville"
      font-size="13"
    >
      Agents · Regions · Queue · CP
    </text>
  </g>

  <!-- Arrows -->
  <g stroke="#B8922A" stroke-width="2.4" fill="none">
    <!-- Sources -> Ingest -->
    <line x1="170" y1="300" x2="600" y2="360" />
    <line x1="430" y1="300" x2="600" y2="360" />
    <line x1="690" y1="300" x2="600" y2="360" />
    <line x1="950" y1="300" x2="600" y2="360" />

    <!-- Ingest -> Storage -->
    <line x1="600" y1="480" x2="600" y2="520" />

    <!-- Storage -> Dashboard -->
    <line x1="900" y1="580" x2="840" y2="580" />
  </g>

  <!-- Ember nodes -->
  <g fill="#C4501A">
    <circle cx="600" cy="360" r="6" />
    <circle cx="600" cy="480" r="5" />
    <circle cx="900" cy="580" r="5" />
  </g>

  <!-- CIC Crest watermark -->
  <g
    transform="translate(1020, 700) scale(0.7)"
    fill="none"
    stroke="#B8922A"
    stroke-width="2"
    opacity="0.22"
  >
    <path d="M20 10 L80 10 L90 30 L50 90 L10 30 Z" />
    <line x1="30" y1="25" x2="70" y2="25" />
    <line x1="30" y1="40" x2="70" y2="40" />
    <line x1="30" y1="55" x2="70" y2="55" />
  </g>
</svg>
