name: Auto-docs

on:
  push:
    branches: ["docs/migration-2026-05-04"]
    paths:
      - "services/**/*.js"
      - "services/**/*.ts"
      - "services/**/*.py"
      - "workflows/**/*.yaml"
      - "agents/**/*.yaml"
  workflow_dispatch:

jobs:
  auto-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/auto-docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: services/auto-docs

      - name: Generate docs for changed files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/index.js
        working-directory: services/auto-docs

      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "docs: auto-update from changed source files [skip ci]"
          git push
