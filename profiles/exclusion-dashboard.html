<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC Exclusion Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { font-size: 24px; margin-bottom: 30px; border-bottom: 2px solid #00ff88; padding-bottom: 10px; }
        h2 { font-size: 16px; margin-top: 30px; margin-bottom: 15px; color: #00ff44; }
        .container { max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .grid-full { grid-column: 1 / -1; }
        .panel {
            border: 1px solid #00ff88;
            padding: 15px;
            background: #0f0f0f;
            border-radius: 2px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ff88;
            padding-bottom: 10px;
        }
        .panel-title { font-weight: bold; color: #00ff44; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-online { background: #00ff88; color: #0a0a0a; }
        .status-degraded { background: #ffaa00; color: #0a0a0a; }
        .status-offline { background: #ff4444; color: #0a0a0a; }
        pre {
            background: #000;
            border: 1px solid #004400;
            padding: 12px;
            overflow-x: auto;
            font-size: 12px;
            margin: 10px 0;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 8px;
            background: #1a1a1a;
            border-left: 2px solid #00ff88;
        }
        .metric-label { font-weight: bold; color: #00ff44; }
        .metric-value { color: #00ff88; font-family: monospace; }
        .error { color: #ff6666; }
        .warning { color: #ffaa00; }
        .success { color: #00ff88; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #004400;
        }
        th { background: #1a1a1a; color: #00ff44; font-weight: bold; }
        tr:hover { background: #1a1a1a; }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #00ff88;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .refresh-btn {
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            padding: 6px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        .refresh-btn:hover { background: #00ff44; }
        .timestamp { color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CIC Exclusion Dashboard</h1>

        <!-- Health Panel -->
        <div class="grid">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Exclusion Health</span>
                    <button class="refresh-btn" onclick="refreshDashboard()">Refresh</button>
                </div>
                <div id="health-content">
                    <div class="spinner"></div> Loading...
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Active Profile</span>
                    <span class="timestamp" id="health-time"></span>
                </div>
                <div id="profile-content">
                    <div class="spinner"></div> Loading...
                </div>
            </div>
        </div>

        <!-- Filters Panel -->
        <div class="panel grid-full">
            <div class="panel-header">
                <span class="panel-title">TorqueQuery Filters</span>
            </div>
            <div id="filters-content">
                <div class="spinner"></div> Loading...
            </div>
        </div>

        <!-- Drift Events Feed -->
        <div class="panel grid-full">
            <div class="panel-header">
                <span class="panel-title">Recent Drift Events</span>
            </div>
            <div id="drift-content">
                <div class="spinner"></div> Loading...
            </div>
        </div>

        <!-- Timeline -->
        <div class="panel grid-full">
            <div class="panel-header">
                <span class="panel-title">Ingestion Timeline</span>
            </div>
            <div id="timeline-content">
                <div class="spinner"></div> Loading...
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = '/exclusion';
        const REFRESH_INTERVAL = 3000; // 3 seconds
        let refreshTimer = null;

        /**
         * Refresh all dashboard panels
         */
        async function refreshDashboard() {
            try {
                const [health, filters, timeline] = await Promise.all([
                    fetch(API_BASE + '/health').then(r => r.json()),
                    fetch(API_BASE + '/filters').then(r => r.json()),
                    fetch(API_BASE + '/timeline').then(r => r.json()),
                ]);

                updateHealthPanel(health);
                updateProfilePanel(health);
                updateFiltersPanel(filters);
                updateTimelinePanel(timeline);
            } catch (error) {
                console.error('Dashboard refresh error:', error);
                document.getElementById('health-content').innerHTML =
                    `<div class="error">Error loading dashboard: ${error.message}</div>`;
            }
        }

        /**
         * Update health panel
         */
        function updateHealthPanel(health) {
            const h = health.health || {};
            const statusClass = `status-${h.status || 'offline'}`;
            const statusText = (h.status || 'offline').toUpperCase();

            let html = `
                <div class="metric">
                    <span class="metric-label">Status</span>
                    <span class="metric-value ${statusClass}">${statusText}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Uptime</span>
                    <span class="metric-value">${formatUptime(h.uptime || 0)}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Drift Events</span>
                    <span class="metric-value">${h.driftEventsDetected || 0}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Timeline Entries</span>
                    <span class="metric-value">${h.timelineEntries || 0}</span>
                </div>
            `;

            if (h.lastError) {
                html += `<div class="metric"><span class="error">Last Error: ${h.lastError}</span></div>`;
            }

            document.getElementById('health-content').innerHTML = html;
            document.getElementById('health-time').innerText = new Date().toLocaleTimeString();
        }

        /**
         * Update profile panel
         */
        function updateProfilePanel(health) {
            const h = health.health || {};
            const profile = h.profile || 'unknown';

            let html = `
                <div class="metric">
                    <span class="metric-label">Current Profile</span>
                    <span class="metric-value" style="font-size: 14px;">${profile}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Last Update</span>
                    <span class="metric-value">${new Date(h.lastUpdate || 0).toLocaleString()}</span>
                </div>
            `;

            document.getElementById('profile-content').innerHTML = html;
        }

        /**
         * Update filters panel
         */
        function updateFiltersPanel(filters) {
            const f = filters.filters || {};

            let html = `
                <h3 style="color: #00ff44; margin: 10px 0;">Exclude Patterns (${(f.exclude || []).length})</h3>
                <pre style="max-height: 200px;">${(f.exclude || []).slice(0, 10).join('\n')}</pre>

                <h3 style="color: #00ff44; margin: 10px 0;">Include Patterns (${(f.include || []).length})</h3>
                <pre style="max-height: 200px;">${(f.include || []).slice(0, 10).join('\n')}</pre>

                <div class="metric">
                    <span class="metric-label">File Size Cap</span>
                    <span class="metric-value">${f.sizeCap || 500} KB</span>
                </div>

                <h3 style="color: #00ff44; margin: 10px 0;">Language Whitelist</h3>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    ${(f.languageWhitelist || []).map(ext => `<span style="background: #004400; padding: 4px 8px;">.${ext}</span>`).join('')}
                </div>
            `;

            document.getElementById('filters-content').innerHTML = html;
        }

        /**
         * Update drift events panel
         */
        function updateTimelinePanel(timeline) {
            const entries = timeline.recent_entries || [];

            if (entries.length === 0) {
                document.getElementById('timeline-content').innerHTML = '<p>No timeline entries yet.</p>';
                return;
            }

            let html = '<table><tr><th>Timestamp</th><th>Profile</th><th>Filters</th><th>Changes</th></tr>';

            entries.slice(-10).reverse().forEach((entry, idx) => {
                const time = new Date(entry.timestamp).toLocaleTimeString();
                const filterCount = (entry.filters.exclude || []).length + (entry.filters.include || []).length;

                html += `
                    <tr>
                        <td>${time}</td>
                        <td><strong>${entry.profile}</strong></td>
                        <td>${filterCount} filters</td>
                        <td>${entry.drift ? Object.values(entry.drift).filter(v => v).length + ' changes' : 'stable'}</td>
                    </tr>
                `;
            });

            html += '</table>';
            document.getElementById('timeline-content').innerHTML = html;
        }

        /**
         * Format uptime duration
         */
        function formatUptime(ms) {
            const seconds = Math.floor((ms / 1000) % 60);
            const minutes = Math.floor((ms / (1000 * 60)) % 60);
            const hours = Math.floor((ms / (1000 * 60 * 60)) % 24);

            const parts = [];
            if (hours > 0) parts.push(hours + 'h');
            if (minutes > 0) parts.push(minutes + 'm');
            if (seconds > 0) parts.push(seconds + 's');

            return parts.join(' ') || '0s';
        }

        // Auto-refresh every N seconds
        function startAutoRefresh() {
            refreshDashboard();
            refreshTimer = setInterval(refreshDashboard, REFRESH_INTERVAL);
        }

        // Stop auto-refresh
        function stopAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', startAutoRefresh);

        // Clean up on page unload
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>
</html>
