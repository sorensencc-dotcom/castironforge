<!-- 
  FILENAME: dashboard/index.html 
  VERSION:  2.0.0 
  DATE:     2026-05-28 
  ROLE:     CIC Pipeline Observatory — INDUSTRIAL EDITION
  THEME:    Forge Noir / Industrial CIC
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIC Observatory | Industrial Console</title>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --forge: #1A1410;   /* Deep BG */
            --iron: #2C2420;    /* Grid / Borders */
            --ember: #C4501A;   /* Primary Accent / OK */
            --rust: #8B3A1A;    /* Error / Warning */
            --brass: #B8922A;   /* Secondary Accent / Strokes */
            --ash: #9A9088;     /* Muted Text */
            --bone: #E8E0D4;    /* Primary Text */
            --white: #ffffff;
            --black: #000000;
            
            --font-title: 'Playfair Display', serif;
            --font-label: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--forge);
            background-image: 
                linear-gradient(rgba(44, 36, 32, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44, 36, 32, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--bone);
            font-family: var(--font-label);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            border: 1px solid var(--iron);
        }

        /* ─── HEADER ─── */
        header {
            padding: 1.5rem 3rem;
            border-bottom: 2px solid var(--iron);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: rgba(26, 20, 16, 0.95);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand-sub {
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--ember);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .title {
            font-family: var(--font-title);
            font-weight: 900;
            font-size: 2.2rem;
            line-height: 1;
            color: var(--white);
            text-transform: none;
            letter-spacing: -0.02em;
        }

        .sys-status {
            text-align: right;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ash);
            letter-spacing: 0.1em;
        }

        .sys-status span { color: var(--brass); }

        /* ─── MAIN GRID ─── */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .cic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* ─── INDUSTRIAL PANEL ─── */
        .cic-panel {
            background: rgba(10, 8, 6, 0.4);
            border: 1px solid var(--iron);
            position: relative;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .cic-panel::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            width: 8px; height: 8px;
            border-top: 2px solid var(--brass);
            border-left: 2px solid var(--brass);
        }

        .cic-panel::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px;
            width: 8px; height: 8px;
            border-bottom: 2px solid var(--brass);
            border-right: 2px solid var(--brass);
        }

        .cic-panel.pulse {
            border-color: var(--ember);
            box-shadow: inset 0 0 15px rgba(196, 80, 26, 0.1);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--iron);
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }

        .agent-name {
            font-family: var(--font-title);
            font-style: italic;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--white);
        }

        .agent-id {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ash);
            text-transform: uppercase;
        }

        .status-block {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .node-dot {
            width: 10px;
            height: 10px;
            background: var(--iron);
            position: relative;
        }

        .node-dot.online { background: var(--ember); box-shadow: 0 0 10px var(--ember); }
        .node-dot.down { background: var(--rust); box-shadow: 0 0 10px var(--rust); }
        .node-dot.degraded { background: var(--brass); box-shadow: 0 0 10px var(--brass); }

        .status-text {
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-text.online { color: var(--ember); }
        .status-text.down { color: var(--rust); }
        .status-text.degraded { color: var(--brass); }

        .metrics {
            margin-top: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .metric-item {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--ash);
        }

        .metric-val { color: var(--bone); font-weight: bold; }

        /* ─── SECURITY TELEMETRY ─── */
        .sec-panel {
            grid-column: 1 / -1;
            background: rgba(139, 58, 26, 0.03);
            border-color: rgba(184, 146, 42, 0.2);
        }

        .sec-header {
            color: var(--ember);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sec-header::after { content: ''; flex: 1; height: 1px; background: rgba(196, 80, 26, 0.2); }

        .sec-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        .sec-stat-box {
            padding: 1rem;
            border-left: 2px solid var(--iron);
        }

        .sec-stat-label { font-size: 0.65rem; color: var(--ash); letter-spacing: 0.1em; }
        .sec-stat-val { font-family: var(--font-mono); font-size: 1.5rem; color: var(--white); font-weight: 700; }

        /* ─── PIPELINE FLOW ─── */
        .flow-container {
            padding: 2rem;
            border-top: 1px solid var(--iron);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flow-inner {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .flow-node {
            border: 1px solid var(--iron);
            padding: 8px 15px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: var(--forge);
            color: var(--ash);
        }

        .flow-node.online { border-color: var(--ember); color: var(--ember); }
        .flow-node.down { border-color: var(--rust); color: var(--rust); }

        .flow-arrow { color: var(--iron); font-size: 1.2rem; }

        /* ─── LOG ─── */
        .log-section {
            padding: 1rem 3rem;
            background: var(--black);
            border-top: 2px solid var(--iron);
            height: 220px;
            display: flex;
            flex-direction: column;
        }

        .log-label {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--ember);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        #event-log {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.6;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid rgba(44, 36, 32, 0.3); padding-bottom: 2px; }
        .log-ts { color: var(--iron); }
        .log-id { color: var(--brass); font-weight: bold; }
        .log-status.ONLINE { color: var(--ember); }
        .log-status.DOWN { color: var(--rust); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--forge); }
        ::-webkit-scrollbar-thumb { background: var(--iron); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-sub">Project Intelligence</span>
            <div class="title">Pipeline Observatory</div>
        </div>
        <div class="sys-status">
            NODE: <span>WSL2-LINUX</span> | 
            SYNC: <span id="last-polled">--:--:--</span> | 
            POLL: <span id="countdown">10</span>s
        </div>
    </header>

    <main>
        <!-- AGENT GRID -->
        <div class="cic-grid" id="agent-grid">
            <!-- Injected via JS -->
        </div>

        <!-- SECURITY TELEMETRY -->
        <div class="cic-panel sec-panel">
            <div class="sec-header">Perimeter Security Telemetry</div>
            <div class="sec-stats">
                <div class="sec-stat-box">
                    <div class="sec-stat-label">TOTAL SCANS</div>
                    <div class="sec-stat-val" id="sec-scans-total">0</div>
                </div>
                <div class="sec-stat-box" style="border-left-color: var(--rust);">
                    <div class="sec-stat-label" style="color: var(--rust);">MALWARE HITS</div>
                    <div class="sec-stat-val" id="sec-malware-hits" style="color: var(--rust);">0</div>
                </div>
                <div class="sec-stat-box">
                    <div class="sec-stat-label">SANDBOX OPS</div>
                    <div class="sec-stat-val" id="sec-sandbox-runs">0</div>
                </div>
                <div class="sec-stat-box">
                    <div class="sec-stat-label">CONTAINER FAIL</div>
                    <div class="sec-stat-val" id="sec-sandbox-fail">0</div>
                </div>
            </div>
            
            <div id="sec-log" style="margin-top: 1.5rem; font-family: var(--font-mono); font-size: 10px; color: var(--ash); height: 80px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--iron);">
                [SEC-OPS] Initializing security trace...
            </div>
        </div>

        <!-- PIPELINE FLOW -->
        <div class="flow-container">
            <div class="flow-inner" id="pipeline-flow">
                <div class="flow-node" id="node-ingestion_agent">INGEST</div>
                <div class="flow-arrow">→</div>
                <div class="flow-node" id="node-extractor_enricher">ENRICH</div>
                <div class="flow-arrow">→</div>
                <div class="flow-node" id="node-research_orchestrator">ORCHESTRATE</div>
                <div class="flow-arrow">→</div>
                <div class="flow-node" id="node-synthesis_agent">SYNTHESIZE</div>
                <div class="flow-arrow">→</div>
                <div class="flow-node" id="node-audit_agent">AUDIT</div>
                <div class="flow-arrow" style="margin-left: 10px;">↑</div>
                <div class="flow-node" id="node-castironforge_mcp" style="background: rgba(184, 146, 42, 0.05);">MCP</div>
            </div>
        </div>
    </main>

    <div class="log-section">
        <div class="log-label">System Event Trace</div>
        <div id="event-log"></div>
    </div>

    <script>
        const AGENTS = [
            { id: 'castironforge_mcp',     name: 'MCP Hub',                url: 'http://localhost:3000/health' },
            { id: 'ingestion_agent',       name: 'Ingestion Boundary',     url: 'http://localhost:3001/health' },
            { id: 'extractor_enricher',    name: 'Extraction Engine',      url: 'http://localhost:3002/health' },
            { id: 'research_orchestrator', name: 'Research Planner',       url: 'http://localhost:3003/health' },
            { id: 'synthesis_agent',       name: 'Synthesis Unit',         url: 'http://localhost:3004/health' },
            { id: 'audit_agent',           name: 'Epistemic Audit',        url: 'http://localhost:3005/health' }
        ];
        const POLL_INTERVAL_MS = 10000;
        const FETCH_TIMEOUT_MS = 5000;

        let lastStatuses = {};
        let countdownValue = POLL_INTERVAL_MS / 1000;
        let countdownTimer = null;

        function formatTime(date) { return date.toTimeString().split(' ')[0]; }

        function formatUptime(seconds) {
            if (typeof seconds !== 'number' || isNaN(seconds)) return '—';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h}h ${m}m ${s}s`;
        }

        function createAgentCards() {
            const grid = document.getElementById('agent-grid');
            AGENTS.forEach(agent => {
                const card = document.createElement('div');
                card.className = 'cic-panel';
                card.id = `card-${agent.id}`;
                card.innerHTML = `
                    <div class="agent-header">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-id">${agent.id}</div>
                    </div>
                    <div class="status-block">
                        <div class="node-dot" id="dot-${agent.id}"></div>
                        <span class="status-text" id="status-text-${agent.id}">INITIALIZING</span>
                    </div>
                    <div class="metrics" id="metrics-${agent.id}">
                        <div class="metric-item">UPTIME: <span class="metric-val uptime-val">—</span></div>
                        <div class="metric-item">LOAD: <span class="metric-val extra-metric">—</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateLog(agentId, status, latency) {
            const log = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = formatTime(new Date());
            const latStr = typeof latency === 'number' ? `${latency}ms` : latency;
            entry.innerHTML = `<span class="log-ts">[${time}]</span> <span class="log-id">${agentId.toUpperCase()}</span> — <span class="log-status ${status}">${status}</span> <span style="color: var(--iron)">(${latStr})</span>`;
            log.insertBefore(entry, log.firstChild);
            if (log.children.length > 50) log.removeChild(log.lastChild);
        }

        function updateUI(agentId, status, data, latency) {
            const card = document.getElementById(`card-${agentId}`);
            const dot = document.getElementById(`dot-${agentId}`);
            const text = document.getElementById(`status-text-${agentId}`);
            const metricsDiv = document.getElementById(`metrics-${agentId}`);
            const node = document.getElementById(`node-${agentId}`);

            if (lastStatuses[agentId] && lastStatuses[agentId] !== status) {
                card.classList.remove('pulse');
                void card.offsetWidth;
                card.classList.add('pulse');
            }
            lastStatuses[agentId] = status;

            const statusLower = status.toLowerCase();
            dot.className = `node-dot ${statusLower}`;
            text.textContent = status;
            text.className = `status-text ${statusLower}`;
            if (node) node.className = `flow-node ${statusLower}`;

            const uptimeVal = metricsDiv.querySelector('.uptime-val');
            const extraMetric = metricsDiv.querySelector('.extra-metric');
            uptimeVal.textContent = data ? formatUptime(data.uptime) : '—';
            
            let extra = 'IDLE';
            if (data) {
                switch(agentId) {
                    case 'castironforge_mcp':
                        if (data.stats) extra = `A:${data.stats.totalAgents ?? 0} P:${data.stats.totalPublished ?? 0}`;
                        break;
                    case 'ingestion_agent': extra = "BOUNDARY LIVE"; break;
                    case 'audit_agent': extra = `R:${data.totalRecords ?? 0}`; break;
                    default: extra = "NOMINAL";
                }
            }
            extraMetric.textContent = extra;
            updateLog(agentId, status, latency);
        }

        async function pollAgent(agent) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
            const start = performance.now();
            try {
                const response = await fetch(agent.url, { signal: controller.signal });
                clearTimeout(timeoutId);
                const latency = Math.round(performance.now() - start);
                if (!response.ok) { updateUI(agent.id, 'DEGRADED', null, latency); return; }
                const body = await response.json();
                updateUI(agent.id, body.ok ? 'ONLINE' : 'DEGRADED', body, latency);
            } catch (err) {
                clearTimeout(timeoutId);
                updateUI(agent.id, 'DOWN', null, err.name === 'AbortError' ? 'timeout' : 'error');
            }
        }

        async function pollSecurity() {
            try {
                const res = await fetch('http://localhost:3000/security/telemetry');
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById('sec-scans-total').textContent = data.stats.scansTotal;
                document.getElementById('sec-malware-hits').textContent = data.stats.malwareDetected;
                document.getElementById('sec-sandbox-runs').textContent = data.stats.sandboxRuns;
                document.getElementById('sec-sandbox-fail').textContent = data.stats.sandboxFailures;
                const logDiv = document.getElementById('sec-log');
                logDiv.innerHTML = data.events.map(ev => {
                    const time = ev.timestamp.split('T')[1].split('.')[0];
                    return `<div>[${time}] ${ev.event.toUpperCase()} - ${ev.file || ev.assetId || ''} (${ev.status})</div>`;
                }).join('') || 'Waiting for events...';
            } catch (err) {}
        }

        async function pollAll() {
            document.getElementById('last-polled').textContent = formatTime(new Date());
            resetCountdown();
            await Promise.allSettled([...AGENTS.map(pollAgent), pollSecurity()]);
        }

        function resetCountdown() {
            clearInterval(countdownTimer);
            countdownValue = POLL_INTERVAL_MS / 1000;
            updateCountdownUI();
            countdownTimer = setInterval(() => {
                countdownValue--;
                if (countdownValue < 0) countdownValue = 0;
                updateCountdownUI();
            }, 1000);
        }
        function updateCountdownUI() { document.getElementById('countdown').textContent = countdownValue; }

        createAgentCards();
        pollAll();
        setInterval(pollAll, POLL_INTERVAL_MS);
    </script>
</body>
</html>
