version: 1
name: roadmap_harvester
description: >
  Autonomous Roadmap Harvester Agent.
  Captures ideas from multiple sources, normalizes them, scores them,
  generates roadmap deltas, and syncs them into the living roadmap.

agents:
  harvester:
    model: claude-opus-4-8
    tools: [retrieval]
    instructions: |
      You are the Roadmap Harvester Agent.
      Convert raw ideas into structured roadmap deltas.

      Accepted input sources:
        - CIC failures and repairs
        - CIC build logs and extractor updates
        - UI/UX ideas and architecture notes
        - PR comments and operator notes
        - External research and Slack-style idea dumps

      Tasks:
      1. Normalize each idea into canonical structure:
           title: string
           description: string
           category: CIC | Extractors | UI | Agents | Infra | Docs
           scope: small | medium | large
           urgency: low | medium | high
           impact: 1–5
           dependencies: list[string]
           suggested_lane: Discovery | Harvester | Redesign | Outreach | Delivery

      2. Score each idea using:
           - impact × urgency weight
           - CIC health relevance (via retrieval against cic/logs and cic/builds)
           - roadmap alignment (via retrieval against cic/roadmap)
           - historical patterns (frequency of similar items in past deltas)

      3. Output roadmap_delta.json:
           new_items: list[NormalizedItem]
           updated_items: list[NormalizedItem]
           removed_items: list[string]  # item IDs
           priority_ranking: list[string]  # ordered item IDs
           autoschedule_suggestions: list[{item_id, lane, estimated_sprint}]

      Constraint: do NOT modify the roadmap directly. Output deltas only.

  synthesizer:
    model: claude-opus-4-8
    tools: [retrieval]
    instructions: |
      You are the Roadmap Synthesizer Agent.
      Tasks:
      - Read roadmap_delta.json from the harvester step.
      - Retrieve the current roadmap version from cic/roadmap.
      - Merge deltas preserving lane structure and version integrity.
      - Increment the roadmap version header on every non-empty delta.
      - Output: roadmap_draft.md

  summarizer:
    model: claude-haiku-4-5-20251001
    tools: []
    instructions: |
      Produce a concise operator-facing summary.md covering:
        - new roadmap items added
        - priority ranking changes
        - autoschedule suggestions
        - items flagged for human approval

retrieval:
  strategy: hybrid
  retrieval_strategy: static
  bm25_index: roadmap_bm25
  vector_index: roadmap_vectors
  fusion: rrf
  scope:
    - cic/roadmap/**
    - cic/logs/**
    - cic/builds/**
    - cic/extractors/**
    - cic/adr/**
    - cic/design/**
    - cic/ui/**
    - cic/self_healing/**
    - cic/agents/**
    - cic/queue/**
    - cic/dlq/**

workflow:
  trigger:
    event: idea.submitted

  steps:
    - id: harvest
      agent: harvester
      depends_on: []
      input:
        idea_payload: ${{ event.idea }}
      output: roadmap_delta.json

    - id: synthesize
      agent: synthesizer
      depends_on: [harvest]
      input:
        delta: ${{ steps.harvest.output }}
      output: roadmap_draft.md

    - id: summary
      agent: summarizer
      depends_on: [harvest, synthesize]
      input:
        delta: ${{ steps.harvest.output }}
        draft: ${{ steps.synthesize.output }}
      output: summary.md

  hitl:
    - step: synthesize
      action: approve
      autonomy_level: CONFIRMATIONAL
      auto_promote_threshold: 25
      confidence_history_window: 30d
      description: Human must approve roadmap_draft.md before version is bumped and roadmap is updated.

outputs:
  - roadmap_delta.json
  - roadmap_draft.md
  - summary.md
